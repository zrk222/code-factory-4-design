[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-factory-4-design"
version = "0.9.0"
description = "Design psychology, ethical emotional journeys, and deterministic UI proof for coding agents. Audits trust, safe failure, agency, inclusive motion, and anti-manipulation guardrails without claiming measured user emotion or conversion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/zrk222/code-factory-4-design"
Documentation = "https://github.com/zrk222/code-factory-4-design#readme"
Issues = "https://github.com/zrk222/code-factory-4-design/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
render = ["playwright>=1.48"]

[project.scripts]
prestige = "prestige_design.cli:main"

[tool.setuptools.packages.find]
include = ["prestige_design*"]

[tool.setuptools.package-data]
prestige_design = ["SKILL.md", "../references/*.html", "../references/*.md", "benchmark_cases/*.json", "benchmark_cases/*.html", "benchmark_cases/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
