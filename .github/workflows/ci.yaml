name: ci
on: [push, pull_request]

concurrency:
  group: prestige-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11","3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,habit]"
      - run: python -m pytest -q
      - name: template passes its own audit
        run: prestige audit references/premium-template.html --strict
      - name: counterfactual design challenge
        run: prestige challenge references/premium-template.html --purpose developer --workflow product

  render-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,habit,render]"
      - run: python -m playwright install --with-deps chromium
      - run: prestige render-audit references/premium-template.html --out-dir .prestige/render
      - run: npm install --prefix .factory/habit-js --no-save --no-audit --no-fund esbuild@0.25.12 typescript@5.9.3
      - name: Replay repaired JSX and TSX in Chromium
        env:
          PRESTIGE_HABIT_ESBUILD: ${{ github.workspace }}/.factory/habit-js/node_modules/esbuild
        run: python -m pytest -q tests/test_habit_engine.py -k transformed_component
      - uses: actions/upload-artifact@v4
        with:
          name: prestige-render-proof
          path: .prestige/render
