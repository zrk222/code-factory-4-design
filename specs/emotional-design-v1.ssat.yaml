name: emotional-design-v1
language: python
modules:
  - name: emotional
    path: prestige_design/emotional.py
    functions:
      - name: audit_emotional_design
        args: [html, css]
        returns: EmotionalReport
      - name: challenge_emotional_design
        args: [html, css]
        returns: dict
      - name: write_emotional_receipt
        args: [payload, destination]
        returns: Path
dependencies: []
invariants:
  - name: emotional_audit_has_no_external_authority
    forbid_pattern: "\\b(?:subprocess|requests|httpx|urllib|socket|openai|publish|deploy)\\b"
    scopes:
      - module: emotional
        symbol: audit_emotional_design
        max_lines: 220
  - name: emotional_challenge_is_bounded
    forbid_pattern: "\\b(?:subprocess|requests|httpx|urllib|socket)\\b"
    scopes:
      - module: emotional
        symbol: challenge_emotional_design
        max_lines: 55
  - name: emotional_receipt_is_local_and_atomic
    forbid_pattern: "\\b(?:requests|httpx|urllib|socket|publish|deploy|send_message)\\b"
    scopes:
      - module: emotional
        symbol: write_emotional_receipt
        max_lines: 15
